name: webhook-relay

x-app: &app
  image: webhook-relay:${RELAY_VERSION:-0.1.0}
  build:
    context: .
    target: runtime
    args:
      VERSION: ${RELAY_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
  env_file: .env
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 192m
  cpus: 0.5
  pids_limit: 128

services:
  db:
    image: postgres:16-alpine@sha256:d845e7f0ac8517b9d9868b6d20379f9688ba3676595e50ca7c0b664964b2a760
    environment:
      POSTGRES_USER: relay
      POSTGRES_DB: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init}
    volumes:
      - relay-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U relay -d relay']
      interval: 2s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 64m
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  receiver:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [uvicorn, 'receiver.main:create_app', --factory, --host, '0.0.0.0', --port, '8001', --no-access-log, --timeout-keep-alive, '5', --log-level, info]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    ports: ['127.0.0.1:8000:8000']
    environment:
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      receiver:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 3s
      timeout: 5s
      retries: 20

  worker:
    <<: *app
    command: [python, -m, app.worker.main]
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, python, -m, app.worker.healthcheck]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      receiver:
        condition: service_healthy

  test-db:
    profiles: [test]
    image: postgres:16-alpine@sha256:d845e7f0ac8517b9d9868b6d20379f9688ba3676595e50ca7c0b664964b2a760
    environment:
      POSTGRES_USER: relay
      POSTGRES_DB: relay_test
      POSTGRES_PASSWORD: isolated-test-password
    tmpfs: ['/var/lib/postgresql/data:size=256m']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U relay -d relay_test']
      interval: 2s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 64m
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128

  test:
    <<: *app
    profiles: [test]
    image: webhook-relay-test:${RELAY_VERSION:-0.1.0}
    build:
      context: .
      target: test
    healthcheck:
      disable: true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 256
    environment:
      DATABASE_URL: postgresql+psycopg://relay:isolated-test-password@test-db:5432/relay_test
      # Keep the suite independent of local .env tuning.
      SOURCE_URL: ''
      TRUST_CF_CONNECTING_IP: 'false'
      BODY_READ_TIMEOUT: '10'
    command: [sh, -c, 'alembic upgrade head && alembic check && pytest -q -p no:cacheprovider']
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  relay-data:
